[package]
name = "gateway"
version.workspace = true
edition.workspace = true

[lib]
name = "gateway"
path = "src/lib.rs"

[[bin]]
name = "gateway"
path = "src/main.rs"

# `kleos-device` used to live here. It moved to its own crate when it gained an
# X25519 half: a device that receives a sealed answer runs AES-GCM, and pulling
# that into the gateway's dependency tree would have made the note on the
# dev-dependency below false for the server too. See ADR 0011 and 0024.

[dependencies]
shared = { path = "../shared" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
dotenvy = { workspace = true }
tower-http = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = "9"
async-trait = "0.1"
rand = "0.8"
sha2 = "0.10"
# Per-purpose signing keys are derived with HMAC-SHA256 rather than a
# prefix hash, so a derived key reveals nothing about the root. See keys.rs.
hmac = "0.12"
# Ed25519 for owner-signed grants, same primitive the enclave already uses.
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto" }
# Chosen over sqlx/diesel deliberately: the gateway needs exactly one table
# and one idempotent CREATE TABLE IF NOT EXISTS, and tokio-postgres is the
# thinnest thing in the tokio ecosystem already in this tree that does it.
tokio-postgres = "0.7"

[dev-dependencies]
tokio = { workspace = true }
tower = { version = "0.4", features = ["util"] }
# Dev-only. The confidentiality invariant is a property of the whole
# gateway<->enclave path, so the test that proves it runs a real enclave
# router in-process rather than a stand-in that could be wrong in the
# gateway's favour. Nothing in the gateway's build depends on the enclave.
enclave = { path = "../enclave" }
serde_json = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
# Dev-only, and for the same reason: the assemble tests stand in for the
# receiving device, so they hold a real X25519 private half and open what the
# enclave sealed. Nothing in the gateway's build encrypts anything.
x25519-dalek = { version = "2", features = ["static_secrets"] }
