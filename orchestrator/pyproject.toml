[project]
name = "memorai-orchestrator"
version = "0.1.0"
description = "Python orchestration service for memorai: ingestion and query graphs over a Neo4j-backed memory layer."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "llama-index-core>=0.12",
    "llama-index-graph-stores-neo4j>=0.4",
    "neo4j>=5.26",
    "rq>=1.16",
    "redis>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
memorai-worker = "orchestrator.jobs.worker:main"
memorai-api = "orchestrator.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
