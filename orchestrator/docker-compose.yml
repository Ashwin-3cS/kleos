# Local dev dependencies for the orchestrator. Ports are deliberately
# non-default so this stack can coexist with other projects' Redis/Neo4j.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: memorai-neo4j
    ports:
      - "127.0.0.1:7688:7687"
      - "127.0.0.1:7475:7474"
    environment:
      NEO4J_AUTH: neo4j/memoraidev
      NEO4J_server_memory_heap_max__size: 512M
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p memoraidev 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - neo4j-data:/data

  # The gateway's sealed OAuth refresh-token store. It lives in this compose
  # file because this is where the project's local services are, but note
  # that the *orchestrator* is deliberately given no credentials for it:
  # nothing in Python ever reads these rows. 5435 because 5432-5434 were
  # commonly taken by other local stacks.
  postgres:
    image: postgres:16-alpine
    container_name: memorai-postgres
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: memorai
      POSTGRES_PASSWORD: memoraidev
      POSTGRES_DB: memorai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorai -d memorai"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: memorai-redis
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  neo4j-data:
  postgres-data:
