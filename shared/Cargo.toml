[package]
name = "shared"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
# Owner-signed grants are verified here rather than in the gateway so the signer
# and the verifier cannot disagree about what is covered. Same Ed25519 the enclave
# already uses, so this adds no new primitive to anything the attestation
# measures. See grants.rs.
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto" }

[dev-dependencies]
rand = "0.8"
