[package]
name = "device"
edition = { workspace = true }
version = { workspace = true }

# A crate of its own rather than a second binary in `gateway`, and the reason is
# in gateway/Cargo.toml: "Nothing in the gateway's build encrypts anything."
# A device that can receive a sealed answer has to hold an X25519 secret and run
# AES-GCM, and putting those in the gateway's dependency tree to get one binary
# out of it would make that comment false for the server as well.
[[bin]]
name = "kleos-device"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
rand = "0.8"
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto" }
# The receiving half of ADR 0024. Every primitive here was chosen so that a
# browser can do the same thing with WebCrypto and no library.
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"

[dev-dependencies]
# Dev-only, and for the reason the gateway's tests take the same dependency:
# the point of this crate is to open what the enclave sealed, and a test that
# proved it against its own sealing would prove nothing.
enclave = { path = "../enclave" }
